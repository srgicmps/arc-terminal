# Vía rápida: cada 5 minutos refresca solo las fuentes urgentes (terremotos, avisos, titulares, IMP…) y
# vuelve a publicar la web. La vía normal (deploy.yml, cada 15 min y en cada push a main) sigue igual.
# - Las demás fuentes no se descargan: `pnpm data` reutiliza su copia publicada mientras no pase su
#   maxAgeMinutes, así que no se gastan los límites de Finnhub, SEC, etc.
# - Con check y test, como deploy.yml, una vez por commit (marca «verificado-<SHA>» en la caché de
#   Actions): si main está en rojo, esta vía no publica.
# - Comparte el grupo de concurrencia con deploy.yml: nunca publican a la vez y, si llega otra pasada
#   mientras hay una en marcha, espera (y una pendiente más nueva sustituye a la anterior, no se acumulan).
name: Vía rápida

on:
  # Minutos 4, 9, 14… Nunca coinciden con los de deploy.yml (7, 22, 37, 52): si coincidieran, una pasada
  # rápida pendiente podría sustituir a una normal y esa vez no correrían issues.ts ni las miniaturas.
  # GitHub puede retrasar el cron unos minutos cuando va cargado.
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:
  # En los PR que tocan este archivo: misma pasada, sin publicar, para comprobarla y medir cuánto tarda.
  pull_request:
    paths: ['.github/workflows/fast.yml']

# Permisos mínimos por defecto; el job pide lo que usa en su propio bloque `permissions`.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('fast-{0}', github.ref) || 'pages-refs/heads/main' }}
  cancel-in-progress: false

env:
  # Fuentes urgentes (si alguna deja de existir, update.ts la ignora). Mercados, para que un -10 % de
  # Bitcoin o de un valor seguido avise en ≤5 min:
  # crypto son 2 peticiones a CoinGecko y alert-quotes, ~22 a Finnhub por pasada (la mitad de sus valores, por turnos; límites: ~30/min y 60/min).
  URGENT: >-
    quakes quakes-es alerts hazards gdacs statuspage ioda ree-demand
    crypto alert-quotes
    news-eco news-geo news-es news-ws news-tech news-ai news-gov imp search

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      # NOVEDADES (scripts/sources/changes.ts) lee los PR fusionados del propio repo.
      pull-requests: read
      # Órdenes de la barra (scripts/requests.ts): leer y cerrar los issues [alerta]/[mis]/[vigila].
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 1) Todas las fuentes: las que no han caducado se copian de la web publicada (rápido, sin gastar
      #    límites). 2) Las urgentes, forzadas aunque su copia sea reciente.
      - name: Datos
        run: |
          pnpm data
          read -ra names <<< "$URGENT"
          FORCE_REFRESH=1 pnpm data "${names[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Las mismas claves que deploy.yml: sin ellas, STATUS daba esas fuentes por «sin clave» cada 5 min.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          # Service token de Cloudflare Access: para leer la copia anterior de la web privada (scripts/lib.ts).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # URL de la web (scripts/site.ts). Variable de GitHub opcional: p. ej. al pasar a un dominio propio.
          SITE_URL: ${{ vars.SITE_URL }}

      # Avisos al móvil con ntfy, como en deploy.yml y con la misma caché del historial (las cachés son por
      # rama, así que las dos vías comparten la de main y ninguna repite un aviso de la otra). Si falla, no
      # frena la publicación.
      - if: github.event_name != 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: .notify-cache
          key: notify-log-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: notify-log-
      - if: github.event_name != 'pull_request'
        run: node scripts/notify.ts
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_CACHE: .notify-cache/notify-log.json
          ALERT_FUEL_ZONE: ${{ secrets.ALERT_FUEL_ZONE }}
          # Opcional: con ella, notify.ts pide los ADR europeos (D25), solo para los avisos.
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Service token de Cloudflare Access: para leer la copia anterior de la web privada (scripts/lib.ts).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # URL de la web (scripts/site.ts). Variable de GitHub opcional: p. ej. al pasar a un dominio propio.
          SITE_URL: ${{ vars.SITE_URL }}
          # Órdenes de la barra (scripts/requests.ts): lee los issues [alerta]/[mis]/[vigila] del dueño y cierra
          # las alertas que avisan.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request' && hashFiles('.notify-cache/notify-log.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: .notify-cache
          key: notify-log-${{ github.run_id }}-${{ github.run_attempt }}

      # Miniaturas del MANUAL: las últimas que guardó deploy.yml (aquí no se capturan). Sin ellas, esta
      # publicación quitaría las imágenes del manual hasta la siguiente pasada normal.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: static/manual
          key: thumbs-solo-restaurar
          restore-keys: thumbs-

      # check y test, una vez por commit, con la misma marca «verificado-<SHA>» que deploy.yml: si este SHA
      # ya los pasó (aquí o en deploy.yml), no se repiten; si no, se corren y, si fallan, no se publica.
      - id: verificado
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: .verificado
          key: verificado-${{ github.sha }}
          lookup-only: true
      - if: steps.verificado.outputs.cache-hit != 'true'
        run: pnpm check
      - if: steps.verificado.outputs.cache-hit != 'true'
        run: pnpm test
      - if: github.event_name != 'pull_request' && steps.verificado.outputs.cache-hit != 'true'
        run: echo "${{ github.sha }}" > .verificado
      - if: github.event_name != 'pull_request' && steps.verificado.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: .verificado
          key: verificado-${{ github.sha }}
      - run: pnpm build --logLevel warn

      # Publica en Cloudflare Pages (web privada, Cloudflare Access delante), como deploy.yml.
      # Si update.ts no pudo leer la copia anterior (.publish-blocked), no se publica: se perderían historiales.
      - if: github.event_name != 'pull_request'
        run: |
          if [ -f .publish-blocked ]; then echo "::error::$(cat .publish-blocked)"; exit 1; fi
          node scripts/cf-config.ts
          npx --yes wrangler@4.145.0 pages project create arc-terminal --production-branch=main || true
          npx --yes wrangler@4.145.0 pages deploy build --project-name=arc-terminal --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Ajustes y avisos por usuario (functions/, cloud/): cf-config.ts saca la base D1 y Access con la API.
          # Las Variables son opcionales (por si el token no tiene esos permisos). SITE_URL: qué web protege Access.
          SITE_URL: ${{ vars.SITE_URL }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
