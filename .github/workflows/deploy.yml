# Descarga los datos, construye la web y la publica en GitHub Pages.
name: Publicar en Pages

on:
  push:
    branches: [main]
  # En los PR solo construye (con datos reales), sin publicar: sirve de prueba antes del merge.
  pull_request:
  # Cada 15 minutos, para refrescar los datos. Minutos 7, 22, 37 y 52 para evitar las horas en
  # punto, cuando GitHub va más cargado. Ojo: GitHub desactiva los cron de un repo público tras
  # 60 días sin actividad.
  schedule:
    - cron: '7,22,37,52 * * * *'
  # Permite lanzarla a mano desde la pestaña Actions.
  workflow_dispatch:

# Permisos mínimos que necesita el despliegue en Pages.
permissions:
  contents: read
  pages: write
  id-token: write
  # Para abrir y cerrar los issues «Fuente caída» (scripts/issues.ts).
  issues: write

# Un solo despliegue a la vez: si llega otro, espera a que acabe el que está en marcha.
# Cada PR va por su lado y no hace esperar a main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Red de seguridad: si algo se cuelga, la Action no se queda horas esperando.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Instala pnpm (la versión sale de "packageManager" en package.json).
      - uses: pnpm/action-setup@v4

      # Instala Node (la versión sale de .nvmrc) y guarda en caché las dependencias.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Descarga los datos en static/data/. Si una fuente falla, se reutiliza su última copia publicada.
      - run: pnpm data
        env:
          SAMPLE: ${{ github.event_name == 'pull_request' && '1' || '' }}
          # Claves opcionales (Settings → Secrets and variables → Actions). Sin ellas, esas fuentes se saltan.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # La SEC pide un User-Agent con nombre y correo; va en un secreto porque el repo es público.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # ReliefWeb solo responde con un appname aprobado por ellos (no es una clave, pero es personal).
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          # aisstream.io (barcos en los puertos, AIS en directo).
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}

      # Abre un issue si una fuente lleva 3 pasadas sin datos y lo cierra cuando vuelve. No en los PR.
      # Si falla, no frena la publicación. Las claves van para taparlas si salen en un error.
      - if: github.event_name != 'pull_request'
        run: node scripts/issues.ts
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}

      - run: pnpm check
      - run: pnpm test
      - run: pnpm build --logLevel warn

      # Solo en los PR: abre todas las vistas a 390 y 1280 px con el Chrome del runner y falla si alguna
      # da errores en la consola, tiene scroll horizontal en el móvil o se queda sin datos (scripts/smoke.ts).
      - if: github.event_name == 'pull_request'
        run: pnpm smoke

      # Solo en los PR: explora las URL de scripts/probe.txt (herramienta de desarrollo).
      - if: github.event_name == 'pull_request'
        run: node scripts/probe.ts
        continue-on-error: true

      # Solo en los PR: capturas de los widgets de TradingView en tema oscuro y claro (scripts/tv-shots.ts).
      # Los colores salen en el registro y las imágenes, en el artefacto «tradingview».
      - if: github.event_name == 'pull_request'
        run: node scripts/tv-shots.ts
        continue-on-error: true
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tradingview
          path: shots/*.png
          if-no-files-found: ignore

      # Solo en los PR: construye main con los mismos datos y compara cada vista a 390 px (filas de tabla y
      # elementos de lista, por panel). La tabla sale en el resumen de la Action y las capturas de las dos
      # versiones, en el artefacto «vistas» (scripts/compare-views.ts).
      - if: github.event_name == 'pull_request'
        run: node scripts/compare-views.ts
        continue-on-error: true
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: vistas
          path: shots/vistas/
          if-no-files-found: ignore

      # Empaqueta la carpeta build/ en el formato que espera Pages.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
