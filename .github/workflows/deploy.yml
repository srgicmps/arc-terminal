# Descarga los datos, construye la web y la publica en Cloudflare Pages (web privada tras Cloudflare Access).
# - push a main, cron y lanzamiento a mano sin «fuentes»: pasada completa y publicación (job build).
# - PR: comprobaciones en jobs separados que corren a la vez, para que el verde o el rojo llegue antes:
#   checks (check, test con cobertura, build, sin datos) · smoke (datos + prueba de humo) · vitals (Core Web
#   Vitals en el móvil, solo avisa) · probe (solo si el PR toca scripts/). Menos jobs a la vez = menos cola en
#   los runners, que comparten todas las sesiones.
# - A mano con «herramienta» (compare, tv-shots o vitals), sobre la rama que se elija: esa revisión, sin publicar.
#   «despertador» (solo desde main) publica el Worker de cloud/cron/, que lanza esta pasada y la de fast.yml a su hora.
# - A mano con «fuentes»: solo `pnpm data <fuentes>` y el sondeo, para probar una fuente sin la pasada completa.
# - Cada `uses:` va fijado al SHA de un commit (un tag se puede mover; un SHA, no), con su tag en el comentario.
#   Para subir una acción: `git ls-remote https://github.com/<dueño>/<acción> 'refs/tags/<tag>*'` (si sale
#   una línea con ^{}, el SHA bueno es el de esa) y se cambian SHA y comentario aquí y en fast.yml.
name: Publicar en Pages

on:
  push:
    branches: [main]
  pull_request:
  # Cada 15 minutos, para refrescar los datos. Minutos 7, 22, 37 y 52 para evitar las horas en
  # punto, cuando GitHub va más cargado. Ojo: GitHub desactiva los cron de un repo público tras
  # 60 días sin actividad. GitHub se salta casi todas (unas 7 al día de 96 en octubre de 2026): a su hora
  # la lanza el despertador (cloud/cron/despertador.ts, con workflow_dispatch) y este cron queda de respaldo.
  schedule:
    - cron: '7,22,37,52 * * * *'
  # Permite lanzarla a mano desde la pestaña Actions.
  workflow_dispatch:
    inputs:
      fuentes:
        description: 'Solo estas fuentes, separadas por espacios (p. ej. «fao climate»): pnpm data + sondeo, sin publicar. Vacío = pasada completa.'
        required: false
        default: ''
      herramienta:
        description: 'Herramienta sobre esta rama, sin publicar la web: compare (vistas frente a main), tv-shots (capturas de TradingView), vitals (Core Web Vitals en el móvil) o despertador (publica el Worker que lanza las pasadas; solo desde main).'
        type: choice
        options: [ninguna, compare, tv-shots, vitals, despertador]
        default: ninguna

# Permisos mínimos: por defecto, solo leer el código (la publicación en Cloudflare usa sus propios Secrets).
# El job que necesita más lo pide en su propio bloque `permissions`, que sustituye a este.
permissions:
  contents: read

# Un solo despliegue a la vez: si llega otro, espera a que acabe el que está en marcha. En un PR, un push
# nuevo cancela la pasada anterior, que ya no sirve. La prueba de fuentes va en su propio grupo para no
# quitarle el turno a una publicación pendiente.
concurrency:
  group: pages-${{ github.ref }}${{ inputs.fuentes && '-fuentes' || '' }}${{ inputs.herramienta && inputs.herramienta != 'ninguna' && '-herramienta' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pasada completa y publicación: push a main, cron y lanzamiento a mano sin «fuentes».
  # A mano, solo desde main: lanzarla sobre otra rama no la publica en la web.
  build:
    if: >-
      github.event_name != 'pull_request' && !inputs.fuentes &&
      (!inputs.herramienta || inputs.herramienta == 'ninguna') &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Red de seguridad: si algo se cuelga, la Action no se queda horas esperando.
    timeout-minutes: 15
    permissions:
      contents: read
      # Abrir y cerrar los issues «Fuente caída» (scripts/issues.ts) y las órdenes de la barra (notify.ts →
      # requests.ts). Es el único job de este archivo que escribe en issues.
      issues: write
      # NOVEDADES (scripts/sources/changes.ts) lee los PR fusionados del propio repo.
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Instala pnpm (la versión sale de "packageManager" en package.json).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # Instala Node (la versión sale de .nvmrc) y guarda en caché las dependencias.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Descarga los datos en static/data/. Si una fuente falla, se reutiliza su última copia publicada.
      - run: pnpm data
        env:
          # NOVEDADES: los PR fusionados, con el token que pone la Action (más límite que sin él).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Claves opcionales (Settings → Secrets and variables → Actions). Sin ellas, esas fuentes se saltan.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # La SEC pide un User-Agent con nombre y correo; va en un secreto porque el repo es público.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # aisstream.io (barcos en los puertos, AIS en directo).
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          # Cloudflare Radar (cortes de internet y DDoS): token con permiso de lectura de Radar.
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Service token de Cloudflare Access: para leer la copia anterior de la web privada (scripts/lib.ts).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # URL de la web (scripts/site.ts). Variable de GitHub opcional: p. ej. al pasar a un dominio propio.
          SITE_URL: ${{ vars.SITE_URL }}
          # MyMemory (titulares en inglés → español, scripts/translate.ts). Este job no corre en los PR.
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}

      # Abre un issue si una fuente lleva 45 min sin datos y lo cierra cuando vuelve.
      # Si falla, no frena la publicación. Las claves van para taparlas si salen en un error.
      - run: node scripts/issues.ts
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Service token de Cloudflare Access: para leer la copia anterior de la web privada (scripts/lib.ts).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # URL de la web (scripts/site.ts). Variable de GitHub opcional: p. ej. al pasar a un dominio propio.
          SITE_URL: ${{ vars.SITE_URL }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}

      # Avisos al móvil con ntfy (scripts/notify.ts y scripts/alerts/): niveles P1–P4 con cupos y un tope
      # de 50 al día. Si falla, no frena la publicación. Sin el secreto NTFY_TOPIC no hace nada. El tema es
      # la única protección del canal: el script nunca lo registra.
      #
      # El historial de avisos se guarda también en la caché de Actions, justo después de enviar: si luego
      # falla el check, los tests, el build o el deploy, la web no se publica, pero la pasada siguiente lee
      # la caché y no repite lo enviado. Una clave por pasada; restore-keys trae la más reciente. La caché
      # solo lleva el historial (ids, horas y valores), nunca el tema ni la zona del diésel.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: .notify-cache
          key: notify-log-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: notify-log-
      - run: node scripts/notify.ts
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_CACHE: .notify-cache/notify-log.json
          # Opcional: zona del diésel, «07» (provincia) o «menorca». Tampoco se registra ni se publica.
          ALERT_FUEL_ZONE: ${{ secrets.ALERT_FUEL_ZONE }}
          # Opcional: con ella, notify.ts pide los ADR europeos (D25), solo para los avisos.
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Service token de Cloudflare Access: para leer la copia anterior de la web privada (scripts/lib.ts).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # URL de la web (scripts/site.ts). Variable de GitHub opcional: p. ej. al pasar a un dominio propio.
          SITE_URL: ${{ vars.SITE_URL }}
          # Órdenes de la barra (scripts/requests.ts): lee los issues [alerta]/[mis]/[vigila] del dueño y cierra
          # las alertas que avisan.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: hashFiles('.notify-cache/notify-log.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: .notify-cache
          key: notify-log-${{ github.run_id }}-${{ github.run_attempt }}

      # check y test, una vez por commit. Al pasarlos se deja en la caché de Actions la marca
      # «verificado-<SHA>» (también fast.yml), y la pasada siguiente sobre ese mismo SHA se los salta: el
      # turno que comparte con fast.yml queda libre antes y un test que falle por la fecha no frena la
      # publicación de datos. Sin marca (el push falló, o su pasada se canceló porque otra la sustituyó en el
      # grupo de concurrencia) o si la caché falla, se corren: nunca se publica un commit sin comprobar.
      - id: verificado
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: .verificado
          key: verificado-${{ github.sha }}
          lookup-only: true
      - if: steps.verificado.outputs.cache-hit != 'true'
        run: pnpm check
      - if: steps.verificado.outputs.cache-hit != 'true'
        run: pnpm test
      - if: steps.verificado.outputs.cache-hit != 'true'
        run: echo "${{ github.sha }}" > .verificado
      - if: steps.verificado.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: .verificado
          key: verificado-${{ github.sha }}

      # Miniaturas de las vistas para el MANUAL (scripts/thumbs.ts), una vez al día: se capturan de la web ya
      # publicada y se guardan en la caché de Actions con la fecha (UTC). Si la caché de hoy ya está, no se
      # repiten; si no, se trae la última y se rehacen. Si fallan, no frenan la publicación: el manual
      # enseña solo las que hay. La caché se guarda sola al acabar el job (si sale bien).
      - id: hoy
        run: echo "fecha=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: thumbs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: static/manual
          key: thumbs-${{ steps.hoy.outputs.fecha }}
          restore-keys: thumbs-
      - if: steps.thumbs.outputs.cache-hit != 'true'
        run: node scripts/thumbs.ts
        continue-on-error: true
        timeout-minutes: 4
        env:
          # Service token de Cloudflare Access: para leer la copia anterior de la web privada (scripts/lib.ts).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # URL de la web (scripts/site.ts). Variable de GitHub opcional: p. ej. al pasar a un dominio propio.
          SITE_URL: ${{ vars.SITE_URL }}

      - run: pnpm build --logLevel warn

      # Publica en Cloudflare Pages (web privada, Cloudflare Access delante). Si el proyecto «arc-terminal»
      # ya existe, el error de «project create» se ignora.
      # Si update.ts no pudo leer la copia anterior (.publish-blocked), no se publica: se perderían historiales.
      - run: |
          if [ -f .publish-blocked ]; then echo "::error::$(cat .publish-blocked)"; exit 1; fi
          node scripts/cf-config.ts
          npx --yes wrangler@4.145.0 pages project create arc-terminal --production-branch=main || true
          npx --yes wrangler@4.145.0 pages deploy build --project-name=arc-terminal --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Ajustes y avisos por usuario (functions/, cloud/): cf-config.ts saca la base D1 y Access con la API.
          # Las Variables son opcionales (por si el token no tiene esos permisos). SITE_URL: qué web protege Access.
          SITE_URL: ${{ vars.SITE_URL }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}

  # PR: lo rápido. No descarga datos ni usa claves: check, test y build funcionan sin static/data.
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Tests con cobertura: falla si una carpeta baja de su suelo (vitest.config.ts, coverage.thresholds).
      - run: pnpm test:cov
      # Tabla de cobertura por carpeta en el resumen de la Action, también si no llega al suelo.
      - if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node --input-type=module >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import { readFileSync } from 'node:fs';
          import { dirname, resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const floors = (await import(pathToFileURL(resolve('vitest.config.ts')).href)).default.test.coverage.thresholds;
          const files = Object.entries(JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8')));
          const keys = ['lines', 'statements', 'branches', 'functions'];
          const pct = (c, t) => (t ? ((100 * c) / t).toFixed(2).replace('.', ',') : '—');
          // Las carpetas con suelo («x/**») y la raíz de scripts/, que no tiene.
          const rows = [...Object.keys(floors), 'scripts/*.ts'].map((glob) => {
            const dir = resolve(glob.replace(/\/\*\*$|\/\*\.ts$/, ''));
            const mine = files.filter(([f]) => (glob.endsWith('/**') ? f.startsWith(dir + '/') : dirname(f) === dir)).map(([, v]) => v);
            const cols = keys.map((k) => pct(mine.reduce((a, v) => a + v[k].covered, 0), mine.reduce((a, v) => a + v[k].total, 0)));
            return `| ${glob} | ${cols.join(' | ')} | ${floors[glob]?.lines ?? '—'} |`;
          });
          console.log(['### Cobertura de los tests (%)', '', '| Carpeta | Líneas | Sentencias | Ramas | Funciones | Suelo (líneas) |', '|---|--:|--:|--:|--:|--:|', ...rows].join('\n'));
          EOF
      - run: pnpm build --logLevel warn
      # Presupuesto de peso por vista (JS, CSS y HTML propios, gzip, sin datos): falla si alguna pasa del tope.
      - run: node scripts/weight.ts
      # Arc OS: cada vista como app (embebida a 390 px) y el escritorio con ventanas, sin datos (scripts/smoke-vistas-os.ts).
      - run: node scripts/smoke-vistas-os.ts

  # PR: datos reales y prueba de humo. Abre todas las vistas a 390 y 1280 px con el Chrome del runner, tres a la vez
  # (SMOKE_CONCURRENCY), y falla si alguna da errores en la consola, tiene scroll horizontal en el móvil, fallos de
  # accesibilidad de estructura (axe-core) o se queda sin datos.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # `pnpm data`: NOVEDADES (scripts/sources/changes.ts) lee los PR fusionados del propio repo.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data
        env:
          SAMPLE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Service token de Cloudflare Access: para leer la copia anterior de la web privada (scripts/lib.ts).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # URL de la web (scripts/site.ts). Variable de GitHub opcional: p. ej. al pasar a un dominio propio.
          SITE_URL: ${{ vars.SITE_URL }}
      - run: pnpm build --logLevel warn
      - run: pnpm smoke
      # Lo mismo en WebKit (motor de Safari) a 390 px con la estética del iPhone de Sergi: lo que Chromium no ve
      # (scroll horizontal, campos que amplían…). Si falla, el PR sale en rojo; si lo que falla es instalar WebKit
      # (red, apt), tras tres intentos se salta, sin poner nada en rojo.
      - id: webkit
        run: for i in 1 2 3; do pnpm exec playwright-core install --with-deps webkit && exit 0; sleep 10; done; exit 1
        continue-on-error: true
      - if: steps.webkit.outcome == 'success'
        run: pnpm smoke
        env:
          # WebKit va más justo en el runner: dos vistas a la vez en vez de tres.
          SMOKE_CONCURRENCY: '2'
          SMOKE_BROWSER: webkit
          SMOKE_WIDTHS: '390'
          SMOKE_MODES: terminal
          SMOKE_STYLE: cupertino

  # PR que cambia la web (y a mano, herramienta «vitals»): Core Web Vitals de laboratorio en el móvil (scripts/vitals.ts).
  # LCP, CLS y TBT de TOP, GEO, WS y FUEL a 390 px con la CPU 4x y 4G lenta, en Terminal y en Sencillo: mediana de 3
  # cargas. Va aparte de smoke porque tarda unos 3 min y así no alarga el PR (corre a la vez) ni comparte CPU con la
  # prueba de humo. Solo avisa: tabla en el resumen de la Action y ::warning si una vista pasa de su presupuesto. Nunca
  # pone el PR en rojo. Un PR que no toca la web (solo cloud/, docs/, otros scripts…) no lo lanza: changes → web.
  # `!cancelled()`: a mano, changes no corre (es solo de los PR) y, sin él, vitals se saltaría también.
  vitals:
    needs: changes
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && needs.changes.outputs.web == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.herramienta == 'vitals'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    # `pnpm data`: NOVEDADES (scripts/sources/changes.ts) lee los PR fusionados del propio repo.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Service token de Cloudflare Access: para leer la copia anterior de la web privada (scripts/lib.ts).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # URL de la web (scripts/site.ts). Variable de GitHub opcional: p. ej. al pasar a un dominio propio.
          SITE_URL: ${{ vars.SITE_URL }}
      - run: pnpm build --logLevel warn
      - run: pnpm vitals
        continue-on-error: true

  # PR: recorridos de punta a punta de Arc OS en el escritorio (scripts/e2e-os.ts), sin datos ni red. Chromium y
  # WebKit (Safari, el del iPhone de Sergi) mandan; Firefox de momento solo avisa. Si lo que falla es instalar el
  # navegador (red, apt), tras tres intentos se salta, sin poner nada en rojo; si fallan las pruebas, sí.
  e2e-os:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    continue-on-error: ${{ matrix.browser == 'firefox' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: navegador
        if: matrix.browser != 'chromium'
        run: for i in 1 2 3; do pnpm exec playwright-core install --with-deps ${{ matrix.browser }} && exit 0; sleep 10; done; exit 1
        continue-on-error: true
      - if: matrix.browser == 'chromium' || steps.navegador.outcome == 'success'
        run: pnpm build --logLevel warn
      - if: matrix.browser == 'chromium' || steps.navegador.outcome == 'success'
        run: pnpm e2e:os
        env:
          E2E_BROWSER: ${{ matrix.browser }}

  # PR: qué toca, para lanzar solo lo que hace falta. scripts → el sondeo (probe); web → vitals (lo que cambia lo que se
  # sirve o cómo se mide: src/, static/, las fuentes, las dependencias, la configuración de la build y el propio vitals).
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.diff.outputs.scripts }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      # La Action de un PR trabaja sobre el commit de merge: su primer padre es la base del PR.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
      - id: diff
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          echo "scripts=$(grep -q '^scripts/' <<< "$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          web='^(src/|static/|scripts/sources/|scripts/(update|browser|vitals)\.ts$|package\.json$|pnpm-lock\.yaml$|svelte\.config\.js$|vite\.config\.ts$)'
          echo "web=$(grep -qE "$web" <<< "$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # PR que toca scripts/: explora las URL de scripts/probe.txt (herramienta de desarrollo).
  probe:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Herramienta de exploración: si una URL falla, no pone el PR en rojo.
      - run: node scripts/probe.ts
        continue-on-error: true
        env:
          # Para las URL de sec.gov (la SEC pide un User-Agent con nombre y correo; probe.ts no lo imprime).
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

  # A mano (herramienta «tv-shots»): capturas de los widgets de TradingView en tema oscuro y claro
  # (scripts/tv-shots.ts). Los colores salen en el registro y las imágenes, en el artefacto «tradingview».
  tv-shots:
    if: github.event_name == 'workflow_dispatch' && inputs.herramienta == 'tv-shots'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `pnpm data`: NOVEDADES (scripts/sources/changes.ts) lee los PR fusionados del propio repo.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Service token de Cloudflare Access: para leer la copia anterior de la web privada (scripts/lib.ts).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # URL de la web (scripts/site.ts). Variable de GitHub opcional: p. ej. al pasar a un dominio propio.
          SITE_URL: ${{ vars.SITE_URL }}
      - run: pnpm build --logLevel warn
      - run: node scripts/tv-shots.ts
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tradingview
          path: shots/*.png
          if-no-files-found: ignore

  # A mano (herramienta «compare»): construye main con los mismos datos y compara cada vista a 390 px
  # (filas de tabla y elementos de lista, por panel). La tabla sale en el resumen de la Action y las
  # capturas de las dos versiones, en el artefacto «vistas» (scripts/compare-views.ts).
  compare:
    if: github.event_name == 'workflow_dispatch' && inputs.herramienta == 'compare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `pnpm data`: NOVEDADES (scripts/sources/changes.ts) lee los PR fusionados del propio repo.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Service token de Cloudflare Access: para leer la copia anterior de la web privada (scripts/lib.ts).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # URL de la web (scripts/site.ts). Variable de GitHub opcional: p. ej. al pasar a un dominio propio.
          SITE_URL: ${{ vars.SITE_URL }}
      - run: pnpm build --logLevel warn
      - run: node scripts/compare-views.ts
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vistas
          path: shots/vistas/
          if-no-files-found: ignore

  # A mano (herramienta «despertador», solo desde main): publica en Cloudflare el Worker de cloud/cron/, que con
  # sus Cron Triggers lanza fast.yml cada 5 min y esta pasada cada 15 (GitHub se salta casi todos los `schedule`),
  # y le pasa el token de GitHub como secret. Usa dos Secrets propios, que solo ve este job:
  # - DESPERTADOR_GH_TOKEN: token fine-grained de GitHub solo de este repo, con Actions: lectura y escritura y
  #   caducidad de 1 año (GitHub propone 30 días). Al caducar, el Worker recibe 401, lo registra como error y no
  #   lanza nada: se vuelve a los `schedule` de GitHub hasta que se guarda otro aquí y se relanza esta herramienta.
  # - DESPERTADOR_CF_TOKEN: token de Cloudflare solo con Account · Workers Scripts · Edit en la cuenta. Va aparte
  #   del CLOUDFLARE_API_TOKEN de siempre (mínimo privilegio): aquel corre en cientos de pasadas al día y no tiene
  #   por qué poder tocar Workers. CLOUDFLARE_ACCOUNT_ID sí es el de siempre.
  # Si falta algo, lo dice en el resumen de la Action y no publica nada.
  despertador:
    if: github.event_name == 'workflow_dispatch' && inputs.herramienta == 'despertador'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # pnpm antes que Node: setup-node v5 ve «packageManager: pnpm» en package.json y prepara su caché él solo,
      # y sin pnpm instalado se para («Unable to locate executable file: pnpm»).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # Node (el de .nvmrc) para wrangler: el Worker no importa nada, no hace falta instalar dependencias.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      # El token de GitHub va al Worker por la entrada estándar: nunca en la línea de órdenes ni en el registro.
      - run: |
          falta() {
            echo "::error title=Despertador::$1"
            printf '### Despertador: no publicado\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          [ "$GITHUB_REF" = refs/heads/main ] || falta "Lánzalo desde main («Use workflow from: main»): se publica el Worker de esa rama."
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || falta "Falta el Secret CLOUDFLARE_ACCOUNT_ID (el de siempre)."
          [ -n "$CLOUDFLARE_API_TOKEN" ] || falta "Falta el Secret DESPERTADOR_CF_TOKEN: un token de Cloudflare (My Profile → API Tokens → Create Token → Create Custom Token) solo con el permiso Account · Workers Scripts · Edit en tu cuenta. Es aparte: el CLOUDFLARE_API_TOKEN de siempre no se toca."
          [ -n "$GH_DISPATCH_TOKEN" ] || falta "Falta el Secret DESPERTADOR_GH_TOKEN (Settings → Secrets and variables → Actions): un token fine-grained de GitHub solo de este repo, con Actions: lectura y escritura y caducidad de 1 año (GitHub propone 30 días). Cuando caduque, el Worker no lanza nada y quedan solo los cron de GitHub hasta que guardes otro aquí y relances esta herramienta."
          npx --yes wrangler@4.145.0 deploy -c cloud/cron/wrangler.toml ||
            falta "Wrangler no ha podido publicar el Worker. Si el registro dice «Authentication error [code: 10000]», al token DESPERTADOR_CF_TOKEN le falta el permiso Account · Workers Scripts · Edit, o es de otra cuenta."
          printf '%s' "$GH_DISPATCH_TOKEN" | npx --yes wrangler@4.145.0 secret put GH_DISPATCH_TOKEN -c cloud/cron/wrangler.toml ||
            falta "El Worker está publicado, pero no se ha podido guardar el token (secret GH_DISPATCH_TOKEN). Vuelve a lanzar la herramienta."
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Despertador publicado
          - Worker «arc-terminal-cron» en Cloudflare, sin URL. Lanza fast.yml cada 5 min y deploy.yml en los minutos 7, 22, 37 y 52 (UTC).
          - Para comprobarlo: en Actions, filtra con «event:workflow_dispatch». En 10-15 min tienen que salir pasadas de «Vía rápida» y «Publicar en Pages».
          - Su registro: en el panel de Cloudflare, el Worker «arc-terminal-cron» → Logs.
          - El token de GitHub caduca (1 año). Entonces el Worker deja de lanzar pasadas y apunta «HTTP 401» como error en su registro; quedan solo los cron de GitHub. Crea otro, guárdalo en DESPERTADOR_GH_TOKEN y vuelve a lanzar esta herramienta.
          EOF
        env:
          # Wrangler lee el token de CLOUDFLARE_API_TOKEN: aquí es el propio del despertador, no el de siempre.
          CLOUDFLARE_API_TOKEN: ${{ secrets.DESPERTADOR_CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.DESPERTADOR_GH_TOKEN }}

  # A mano con «fuentes»: descarga solo esas fuentes (sin usar la copia guardada) y lanza el sondeo.
  # No construye ni publica.
  fuentes:
    if: github.event_name == 'workflow_dispatch' && inputs.fuentes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `pnpm data`: NOVEDADES (scripts/sources/changes.ts) lee los PR fusionados del propio repo.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # El input va por una variable de entorno, nunca pegado en el comando (evita inyección de órdenes), y
      # solo se aceptan nombres de fuente: letras, números y guiones.
      - run: |
          if [[ ! "$FUENTES" =~ ^[a-z0-9\ -]+$ ]]; then echo "Nombres de fuente no válidos: $FUENTES"; exit 1; fi
          read -ra names <<< "$FUENTES"
          pnpm data "${names[@]}"
        env:
          FUENTES: ${{ inputs.fuentes }}
          FORCE_REFRESH: '1'
          SAMPLE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Service token de Cloudflare Access: para leer la copia anterior de la web privada (scripts/lib.ts).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # URL de la web (scripts/site.ts). Variable de GitHub opcional: p. ej. al pasar a un dominio propio.
          SITE_URL: ${{ vars.SITE_URL }}
      - run: node scripts/probe.ts
        continue-on-error: true
