<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#080a0d" />
		<!-- PWA: se puede instalar en la pantalla de inicio (las rutas son relativas a /arc-terminal/) -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- iOS: a pantalla completa, con la barra de estado oscura sobre nuestro fondo -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Arc Terminal" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap"
		/>
		<script>
			// Tema que se ve (día o noche), puesto antes de pintar para que no parpadee. El modo guardado
			// manda; si no hay o es «auto», el del sistema. Lo mantiene al día src/lib/theme.svelte.ts.
			var t;
			try {
				t = localStorage.getItem('arc-theme');
			} catch (e) {}
			if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
			document.documentElement.dataset.theme = t;
			// Color de acento elegido en «A tu gusto» (src/lib/taste.svelte.ts); sin nada, el ámbar.
			try {
				var a = localStorage.getItem('arc-accent');
				if (a === 'cyan' || a === 'blue') document.documentElement.dataset.accent = a;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
