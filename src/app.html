<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#080a0d" />
		<!-- PWA: se puede instalar en la pantalla de inicio (rutas relativas a la base; use-credentials: con Cloudflare Access, el manifest también lleva la cookie del login) -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" crossorigin="use-credentials" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- iOS: a pantalla completa, con la barra de estado oscura sobre nuestro fondo -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Arc Terminal" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap"
		/>
		<script>
			// Tema que se ve (día o noche), puesto antes de pintar para que no parpadee. El modo guardado
			// manda; si no hay o es «auto», el del sistema. Lo mantiene al día src/lib/theme.svelte.ts.
			var t;
			try {
				t = localStorage.getItem('arc-theme');
			} catch (e) {}
			if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
			document.documentElement.dataset.theme = t;
			// Color de acento elegido en «A tu gusto» (src/lib/taste.svelte.ts); sin nada, el ámbar.
			try {
				var a = localStorage.getItem('arc-accent');
				if (a === 'cyan' || a === 'blue') document.documentElement.dataset.accent = a;
				// Y la densidad (compacta, si no hay nada).
				if (localStorage.getItem('arc-density') === 'comoda') document.documentElement.dataset.density = 'comoda';
			} catch (e) {}
			// Estética (src/lib/taste.svelte.ts). La primera vez se decide y se guarda: «Terminal» si este
			// navegador ya usaba la web (tiene claves arc-), «Moderna» si es nuevo. Con «Moderna», también Inter.
			var s = 'modern';
			try {
				s = localStorage.getItem('arc-style');
				if (s !== 'terminal' && s !== 'modern') {
					var old = false;
					for (var i = 0; i < localStorage.length; i++) if ((localStorage.key(i) || '').indexOf('arc-') === 0) old = true;
					s = old ? 'terminal' : 'modern';
					localStorage.setItem('arc-style', s);
				}
			} catch (e) {}
			document.documentElement.dataset.style = s;
			if (s === 'modern') {
				var f = document.createElement('link');
				f.id = 'font-modern';
				f.rel = 'stylesheet';
				f.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap';
				document.head.append(f);
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
