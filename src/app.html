<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover: la web llega a los bordes del iPhone y los env(safe-area-inset-*) dejan de valer 0, así la
		     barra inferior y los paneles ampliados se apartan de la barra de inicio y de la muesca -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#080a0d" />
		<!-- PWA: se puede instalar en la pantalla de inicio (rutas relativas a la base; use-credentials: con Cloudflare Access, el manifest también lleva la cookie del login) -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" crossorigin="use-credentials" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- iOS: a pantalla completa, con la barra de estado oscura sobre nuestro fondo -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Arc Terminal" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<!-- iOS: pantalla de arranque al abrir la app instalada (la generan scripts/icons.ts y el logo) -->
		<link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash-1320x2868.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash-1290x2796.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash-1284x2778.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash-1206x2622.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash-1179x2556.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash-1170x2532.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash-1125x2436.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="%sveltekit.assets%/splash-828x1792.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="%sveltekit.assets%/splash-750x1334.png" />
		<!-- Las letras (Plex e Inter) vienen con la web: src/styles/fonts.css, dentro del CSS de la app. -->
		<script>
			// Tema que se ve (día o noche), puesto antes de pintar para que no parpadee. El modo guardado
			// manda; si no hay o es «auto», el del sistema. Lo mantiene al día src/lib/theme.svelte.ts.
			var t;
			try {
				t = localStorage.getItem('arc-theme');
			} catch (e) {}
			if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
			document.documentElement.dataset.theme = t;
			// Arc OS (/os) no usa la estética, el acento ni la densidad de la web en el escritorio: lleva los colores de
			// su aspecto (src/lib/os/look.ts). Las vistas de sus ventanas (?embed=1) sí los usan.
			var embed = /[?&]embed=1(&|$)/.test(location.search) && window.parent !== window;
			var osl = !embed && /\/os\/?$/.test(location.pathname);
			if (osl) {
				document.documentElement.dataset.osLook = '1';
				try {
					var sk = localStorage.getItem('arc-os-skin');
					document.documentElement.dataset.osSkin = sk && /^[a-z]+$/.test(sk) ? sk : 'mando';
				} catch (e) {
					document.documentElement.dataset.osSkin = 'mando';
				}
			}
			// Color de acento elegido en «A tu gusto» (src/lib/taste.svelte.ts); sin nada, el ámbar.
			if (!osl) try {
				var a = localStorage.getItem('arc-accent');
				if (a === 'amber' || a === 'cyan' || a === 'blue') document.documentElement.dataset.accent = a;
				// Y la densidad («Normal», la de la estética, si no hay nada).
				var d = localStorage.getItem('arc-density');
				if (d === 'compacta' || d === 'comoda') document.documentElement.dataset.density = d;
			} catch (e) {}
			// Modo Sencillo o Terminal (src/lib/modo.ts, decideModo: misma regla). Sin nada guardado, quien ya tenía
			// otras claves arc-… sigue en Terminal y quien llega nuevo empieza en Sencillo; se guarda la decisión.
			var m = 'terminal';
			try {
				m = localStorage.getItem('arc-modo');
				if (m !== 'sencillo' && m !== 'terminal') {
					m = 'sencillo';
					for (var i = 0; i < localStorage.length; i++) {
						var k = localStorage.key(i);
						if (k && k.indexOf('arc-') === 0 && k !== 'arc-modo') m = 'terminal';
					}
					localStorage.setItem('arc-modo', m);
				}
			} catch (e) {}
			document.documentElement.dataset.modo = m;
			// Arc OS: una vista dentro de una ventana (?embed=1) va sin la cabecera de la web (src/lib/os/embed.ts).
			if (embed) document.documentElement.dataset.embed = '1';
			// Estética: como decideStyle (src/lib/estilos.ts). Solo vale un id de ESTILOS (esta lista; src/lib/apphtml.test.ts
			// comprueba que es la misma): con otro se pediría una hoja que no existe, un 404 que bloquea el pintado.
			var estilos = ['terminal', 'grafito', 'cristal', 'papel', 'calido', 'cupertino', 'retro', 'neon', 'brutal', 'bauhaus', 'suizo', 'cuaderno', 'nordico', 'lujo', 'oceano', 'plano', 'contraste', 'zen'];
			var st;
			try {
				st = localStorage.getItem('arc-style');
				if (estilos.indexOf(st) < 0) {
					// «modern» es la antigua Grafito. Sin nada (o con una que ya no existe), quien ya usaba la web sigue en
					// Terminal y quien llega nuevo empieza en Grafito.
					var old = st === 'modern';
					st = 'grafito';
					for (var j = 0; !old && j < localStorage.length; j++) {
						var q = localStorage.key(j);
						if (q && q.indexOf('arc-') === 0 && q !== 'arc-modo' && q !== 'arc-style') st = 'terminal';
					}
					localStorage.setItem('arc-style', st);
				}
			} catch (e) {}
			st = st || 'grafito';
			if (!osl) document.documentElement.dataset.style = st;
			if (!osl && st !== 'terminal') document.write('<link id="style-sheet" rel="stylesheet" href="%sveltekit.assets%/estilos/' + st + '.css">');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
